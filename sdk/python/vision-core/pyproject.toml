[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-python"
version = "0.1.0"
description = "Vision Analytics SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27"
]

[project.optional-dependencies]
django = ["django>=3.2"]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
